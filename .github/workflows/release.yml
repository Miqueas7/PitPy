name: Build & publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# El motor tiene núcleo C++ (nanobind), así que hay una rueda por plataforma. La
# ABI estable de CPython hace que una rueda sirva para 3.12+ en vez de una por
# versión, pero el sistema operativo y la arquitectura siguen necesitando la suya.
jobs:
  ruedas:
    name: Ruedas en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
      - uses: actions/upload-artifact@v4
        with:
          name: ruedas-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Distribución de fuente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - name: Revisar los metadatos
        run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publicar en PyPI
    needs: [ruedas, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (sin token en secrets)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
