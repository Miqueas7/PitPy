[build-system]
requires = ["scikit-build-core>=0.8", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pitpy"
version = "0.1.0.dev0"
description = "Convierte una carcaza de pit optimizado en un diseño geométrico operativo: bancos, bermas y rampa"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Miqueas Quintanilla Ventura", email = "miqueasq@gmail.com" }]
keywords = ["mining", "open-pit", "mine-design", "pit-design", "dxf", "mineria",
            "bancos", "berma", "rampa", "recmin"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# Sin tope superior a propósito. El motor está probado contra numpy 1.26 y 2.4:
# la misma suite pasa con las dos. Capar a <2 en una librería publicada obliga a
# degradar numpy en el entorno de quien la instale. Si el destino es un VPS sin
# x86-64-v2 (donde las ruedas de numpy 2 no corren), el pin va en el despliegue,
# no acá.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Miqueas7/PitPy"
Repository = "https://github.com/Miqueas7/PitPy"
Issues = "https://github.com/Miqueas7/PitPy/issues"
Changelog = "https://github.com/Miqueas7/PitPy/blob/master/CHANGELOG.md"

[project.scripts]
pitpy = "pitpy.cli:main"

[tool.scikit-build]
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"
# Anclados con "/" al inicio: sin eso, un patrón como CMakeLists.txt matchea
# también dentro de .venv y el sdist se lleva la virtualenv entera. Pasó.
sdist.include = ["/CHANGELOG.md", "/include/**/*.hpp", "/bindings/*.cpp", "/CMakeLists.txt"]
sdist.exclude = ["/.venv", "/build", "/dist", "/.pytest_cache", "**/__pycache__"]
cmake.build-type = "Release"
cmake.args = ["-DPITPY_BUILD_PYTHON=ON"]
wheel.packages = ["src/pitpy"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux*"
test-requires = "pytest"
# Sin el caso base (no se versiona) corren los tests de geometría sintética y los
# diferenciales del núcleo, que son justamente los que prueban la extensión.
test-command = "pytest {project}/tests -q -rs -p no:cacheprovider"

[tool.pytest.ini_options]
testpaths = ["tests"]
